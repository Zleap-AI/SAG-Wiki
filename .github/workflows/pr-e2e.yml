name: PR E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
            binary: src-tauri/target/debug/sag
          - platform: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            binary: src-tauri/target/debug/sag.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
      # Restore the same trusted-main debug dependency cache; PRs never save it.
      - name: Restore trusted Rust E2E dependencies
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/debug/.fingerprint/*
            src-tauri/target/debug/build/*
            src-tauri/target/debug/deps/*.rlib
            src-tauri/target/debug/deps/*.rmeta
            src-tauri/target/debug/deps/*.d
            src-tauri/target/debug/deps/*.a
            src-tauri/target/debug/deps/*.lib
            src-tauri/target/debug/deps/*.so
            src-tauri/target/debug/deps/*.dylib
            src-tauri/target/debug/deps/*.dll
            !src-tauri/target/debug/.fingerprint/sag-*
            !src-tauri/target/debug/build/sag-*
            !src-tauri/target/debug/deps/libsag_*
            !src-tauri/target/debug/deps/sag_*
          key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug-
      - name: Verify relocatable QPDF runtime package
        run: node --test scripts/qpdf-packaging.node-test.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Embed the browser workspace in the E2E executable
        run: |
          npm ci
          node --input-type=module -e "import {buildWebAssets} from './scripts/build-web-assets.mjs'; buildWebAssets();"
          echo "SAG_WEB_DIST=$GITHUB_WORKSPACE/dist-web" >> "$GITHUB_ENV"
      # Only compile the CLI needed by E2E, without Tauri or installers.
      - name: Prepare E2E executable
        run: cargo build --locked --manifest-path cli/Cargo.toml
      - name: Verify service shutdown synchronization
        run: cargo test --locked --manifest-path client/Cargo.toml shutdown_tests
      - name: Exercise real service and CLI with local Jev fixture
        run: python tests/local-jev-e2e.py --binary "${{ matrix.binary }}"

      - name: Exercise CLI-managed HTTP API and persisted state
        run: python tests/http-api-e2e.py --binary "${{ matrix.binary }}"

      - name: Exercise the real browser workspace and independent service switches
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/sag-web-browser/node_modules/playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/sag-web-browser" --no-save --package-lock=false playwright@1.65.1
          node "$RUNNER_TEMP/sag-web-browser/node_modules/playwright/cli.js" install chromium
          python tests/web-service-e2e.py --binary "${{ matrix.binary }}"

  qpdf-linux:
    name: QPDF package Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify relocatable QPDF runtime package
        run: node --test scripts/qpdf-packaging.node-test.mjs

  release-tooling:
    name: Test release tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Select release infrastructure changes without running a release
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const paths = execFileSync('git', ['diff', '--name-only', '-z', process.env.BASE_SHA, 'HEAD', '--'], {encoding: 'utf8'}).split('\0').filter(Boolean);
          const relevant = paths.some(path => /^(?:\.github\/workflows\/|config\/|src-tauri\/src\/update-fixtures\/)/.test(path) ||
            /^scripts\/(?:automatic-release|release|configure-release|migrate-release-environment|sign-macos-release|build-cli|package-updates|verify-update)[^/]*\.mjs$/.test(path) ||
            /^(?:package(?:-lock)?\.json|(?:cli|src-tauri)\/Cargo\.(?:toml|lock)|src-tauri\/tauri[^/]*\.json|docs-site\/lib\/release-downloads\.ts)$/.test(path));
          appendFileSync(process.env.GITHUB_OUTPUT, `relevant=${relevant}\n`);
          NODE
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          python-version: '3.13.9'
      - name: Install locked test tools without lifecycle scripts
        if: steps.changes.outputs.relevant == 'true'
        run: npm ci --ignore-scripts
      - name: Regress preparation, trust, signing, assembly and cache gates
        if: steps.changes.outputs.relevant == 'true'
        run: node --test scripts/automatic-release.node-test.mjs scripts/release.node-test.mjs scripts/release-downloads.node-test.mjs scripts/release-build-cache.node-test.mjs scripts/sign-macos-release.node-test.mjs scripts/release-assembly.node-test.mjs scripts/build-cli.node-test.mjs
