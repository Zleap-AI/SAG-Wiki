name: Request desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing reviewed or automatically prepared version tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  actions: write

concurrency:
  group: request-release-${{ inputs.tag }}
  cancel-in-progress: false
  queue: max

jobs:
  request:
    if: github.repository == 'Zleap-AI/SAG-Wiki' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Validate the immutable tag and dispatch or resume its checked release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/automatic-release.mjs request
