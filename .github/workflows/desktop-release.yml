name: Desktop build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Main builds need no signing secrets or repository write token.
# Only protected tag release jobs gain signing credentials and write access.
permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  # Share compatible CLI/desktop dependencies; Cargo separates profiles and targets.
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
  RUST_BACKTRACE: '1'
  # Native tests create their own async runtimes and child processes. Bound
  # concurrent tests on the small hosted runners without reducing coverage.
  RUST_TEST_THREADS: '2'
  PYTHONUTF8: '1'

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      reuse: ${{ steps.cache.outputs.reuse }}
      source_run: ${{ steps.cache.outputs.source_run }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
      - name: Validate versions, commit and release tag
        id: source
        run: node scripts/release.mjs validate
      - name: Test release validation and signing
        run: node --test scripts/release.node-test.mjs scripts/release-downloads.node-test.mjs scripts/release-build-cache.node-test.mjs scripts/sign-macos-release.node-test.mjs

      - name: Find a verified main build for this exact commit
        id: cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs resolve

  documentation:
    name: Build bilingual documentation
    needs: validate
    if: needs.validate.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - run: npm --prefix docs-site ci
      - run: npm --prefix docs-site run build

  frontend:
    name: Test frontend
    needs: validate
    if: needs.validate.outputs.reuse != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
          cache: npm
      - run: npm ci
      - name: Run platform-independent frontend tests once
        run: npm test

  build:
    name: Build and test ${{ matrix.platform }}
    needs: validate
    if: needs.validate.outputs.reuse != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.9'
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      # Cache dependency libraries/build metadata, not app or integration-test binaries.
      # Stable keys avoid a multi-GiB snapshot for every main commit.
      - name: Restore Rust debug cache
        id: rust-debug
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/debug/.fingerprint/*
            src-tauri/target/debug/build/*
            src-tauri/target/debug/deps/*.rlib
            src-tauri/target/debug/deps/*.rmeta
            src-tauri/target/debug/deps/*.d
            src-tauri/target/debug/deps/*.a
            src-tauri/target/debug/deps/*.lib
            src-tauri/target/debug/deps/*.so
            src-tauri/target/debug/deps/*.dylib
            src-tauri/target/debug/deps/*.dll
            !src-tauri/target/debug/.fingerprint/sag-*
            !src-tauri/target/debug/build/sag-*
            !src-tauri/target/debug/deps/libsag_*
            !src-tauri/target/debug/deps/sag_*
          key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug-
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Regress release assembly, signatures and artifact transfer on this platform
        run: node --test scripts/release.node-test.mjs scripts/release-downloads.node-test.mjs scripts/release-build-cache.node-test.mjs scripts/sign-macos-release.node-test.mjs scripts/release-assembly.node-test.mjs scripts/build-cli.node-test.mjs
      - name: Test Safari native saving and build development installer
        if: matrix.platform == 'macos'
        run: |
          swiftc browser-extension/safari/ClipFileStore.swift browser-extension/tests/ClipFileStoreTests.swift -o "$RUNNER_TEMP/clip-file-tests"
          "$RUNNER_TEMP/clip-file-tests"
          swiftc browser-extension/safari/ClipFileStore.swift browser-extension/tests/DefaultDirectoryTests.swift -o "$RUNNER_TEMP/clip-default-tests"
          "$RUNNER_TEMP/clip-default-tests"
          node --test scripts/clipper-build.node-test.mjs
          npm run build:clipper:safari
      - name: Upload Safari development installer for acceptance
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: safari-development-${{ github.sha }}
          path: browser-extension/build/sag-web-clipper-safari-development.dmg
          if-no-files-found: error
          retention-days: 3
      - name: Run native tests with locked dependencies
        run: |
          cargo test --locked --manifest-path protocol/Cargo.toml
          cargo test --locked --manifest-path client/Cargo.toml
          cargo test --locked --manifest-path core/Cargo.toml
          # Fail within a bounded regression test if daemon pipes leak again,
          # before running CLI tests that collect complete subprocess output.
          cargo test --locked --manifest-path cli/Cargo.toml --test service_spawn -- --nocapture
          cargo test --locked --manifest-path cli/Cargo.toml -- --nocapture
          cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Save trusted main Rust debug cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.rust-debug.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/debug/.fingerprint/*
            src-tauri/target/debug/build/*
            src-tauri/target/debug/deps/*.rlib
            src-tauri/target/debug/deps/*.rmeta
            src-tauri/target/debug/deps/*.d
            src-tauri/target/debug/deps/*.a
            src-tauri/target/debug/deps/*.lib
            src-tauri/target/debug/deps/*.so
            src-tauri/target/debug/deps/*.dylib
            src-tauri/target/debug/deps/*.dll
            !src-tauri/target/debug/.fingerprint/sag-*
            !src-tauri/target/debug/build/sag-*
            !src-tauri/target/debug/deps/libsag_*
            !src-tauri/target/debug/deps/sag_*
          key: ${{ steps.rust-debug.outputs.cache-primary-key }}
      # Ordinary bundles have no updater signing enabled. The release job signs
      # the exact artifacts produced and tested here, without rebuilding them.
      - name: Free debug test outputs before production compilation
        run: |
          node --input-type=module -e "import {rmSync} from 'node:fs'; for (const path of ['src-tauri/target/debug']) rmSync(path, {recursive:true, force:true});"
      - name: Restore Rust release cache
        id: rust-release
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src-tauri/target/release/.fingerprint/*
            src-tauri/target/release/build/*
            src-tauri/target/release/deps/*.rlib
            src-tauri/target/release/deps/*.rmeta
            src-tauri/target/release/deps/*.d
            src-tauri/target/release/deps/*.a
            src-tauri/target/release/deps/*.lib
            src-tauri/target/release/deps/*.so
            src-tauri/target/release/deps/*.dylib
            src-tauri/target/release/deps/*.dll
            !src-tauri/target/release/.fingerprint/sag-*
            !src-tauri/target/release/build/sag-*
            !src-tauri/target/release/deps/libsag_*
            !src-tauri/target/release/deps/sag_*
            src-tauri/target/${{ matrix.target }}/release/.fingerprint/*
            src-tauri/target/${{ matrix.target }}/release/build/*
            src-tauri/target/${{ matrix.target }}/release/deps/*.rlib
            src-tauri/target/${{ matrix.target }}/release/deps/*.rmeta
            src-tauri/target/${{ matrix.target }}/release/deps/*.d
            src-tauri/target/${{ matrix.target }}/release/deps/*.a
            src-tauri/target/${{ matrix.target }}/release/deps/*.lib
            src-tauri/target/${{ matrix.target }}/release/deps/*.so
            src-tauri/target/${{ matrix.target }}/release/deps/*.dylib
            src-tauri/target/${{ matrix.target }}/release/deps/*.dll
            !src-tauri/target/${{ matrix.target }}/release/.fingerprint/sag-*
            !src-tauri/target/${{ matrix.target }}/release/build/sag-*
            !src-tauri/target/${{ matrix.target }}/release/deps/libsag_*
            !src-tauri/target/${{ matrix.target }}/release/deps/sag_*
          key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-
      - name: Build unsigned desktop installers
        run: |
          config_args=()
          if [[ "$RELEASE_PLATFORM" == windows ]]; then
            config_args=(--config src-tauri/tauri.windows.conf.json)
          fi
          npm run tauri -- build --ci --target "$TARGET_TRIPLE" "${config_args[@]}" -- --locked
      - name: Verify the actual macOS application bundle
        if: matrix.platform == 'macos'
        run: |
          export SAG_DESKTOP_BUNDLE="$PWD/src-tauri/target/$TARGET_TRIPLE/release/bundle/macos/SAG Wiki.app"
          python -m unittest discover -s tests -p desktop_bundle_test.py
      - name: Exercise local Jev through the actual macOS bundle CLI
        if: matrix.platform == 'macos'
        run: python tests/local-jev-e2e.py --binary "src-tauri/target/$TARGET_TRIPLE/release/bundle/macos/SAG Wiki.app/Contents/Resources/bin/sag"
      - name: Stage artifacts and record their source and digests
        run: node scripts/release.mjs stage --platform "$RELEASE_PLATFORM" --target "$TARGET_TRIPLE"
      - name: Install and exercise the Windows package
        id: windows-smoke
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & ./scripts/smoke-windows.ps1 -Installer "release-artifacts/windows/SAG-Wiki-$env:RELEASE_VERSION-Windows-x64-setup.exe" -Version $env:RELEASE_VERSION
      - name: Exercise local Jev through the installed Windows package CLI
        if: matrix.platform == 'windows'
        env:
          INSTALLED_CLI: ${{ steps.windows-smoke.outputs.cli }}
        run: python tests/local-jev-e2e.py --binary "$INSTALLED_CLI"
      - name: Upload only staged public artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ matrix.platform }}-${{ github.sha }}
          path: release-artifacts/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save trusted main Rust release cache
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.rust-release.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src-tauri/target/release/.fingerprint/*
            src-tauri/target/release/build/*
            src-tauri/target/release/deps/*.rlib
            src-tauri/target/release/deps/*.rmeta
            src-tauri/target/release/deps/*.d
            src-tauri/target/release/deps/*.a
            src-tauri/target/release/deps/*.lib
            src-tauri/target/release/deps/*.so
            src-tauri/target/release/deps/*.dylib
            src-tauri/target/release/deps/*.dll
            !src-tauri/target/release/.fingerprint/sag-*
            !src-tauri/target/release/build/sag-*
            !src-tauri/target/release/deps/libsag_*
            !src-tauri/target/release/deps/sag_*
            src-tauri/target/${{ matrix.target }}/release/.fingerprint/*
            src-tauri/target/${{ matrix.target }}/release/build/*
            src-tauri/target/${{ matrix.target }}/release/deps/*.rlib
            src-tauri/target/${{ matrix.target }}/release/deps/*.rmeta
            src-tauri/target/${{ matrix.target }}/release/deps/*.d
            src-tauri/target/${{ matrix.target }}/release/deps/*.a
            src-tauri/target/${{ matrix.target }}/release/deps/*.lib
            src-tauri/target/${{ matrix.target }}/release/deps/*.so
            src-tauri/target/${{ matrix.target }}/release/deps/*.dylib
            src-tauri/target/${{ matrix.target }}/release/deps/*.dll
            !src-tauri/target/${{ matrix.target }}/release/.fingerprint/sag-*
            !src-tauri/target/${{ matrix.target }}/release/build/sag-*
            !src-tauri/target/${{ matrix.target }}/release/deps/libsag_*
            !src-tauri/target/${{ matrix.target }}/release/deps/sag_*
          key: ${{ steps.rust-release.outputs.cache-primary-key }}

  macos-sign:
    name: Sign and notarize macOS
    needs: [validate, build, documentation, frontend]
    if: >-
      always() && !cancelled() && github.repository == 'Zleap-AI/SAG-Wiki' &&
      startsWith(github.ref, 'refs/tags/v') && needs.validate.result == 'success' &&
      (needs.validate.outputs.reuse == 'true' ||
      (needs.build.result == 'success' && needs.documentation.result == 'success' && needs.frontend.result == 'success'))
    runs-on: macos-15
    timeout-minutes: 90
    environment:
      name: release
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13.9'
      - name: Verify protected release environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs verify-environment
      - name: Download digest-verified tested platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.validate.outputs.source_run }}
        run: node scripts/release-build-cache.mjs download
      # Finalize the tested app without rebuilding. Apple secrets are scoped to
      # this protected tag-only step, never ordinary main/PR build jobs.
      - name: Sign, notarize and test the final macOS installer and updater
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/sign-macos-release.mjs --input release-artifacts --output signed-release-artifacts
      - name: Upload verified signed macOS artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-macos-signed-${{ github.sha }}
          path: signed-release-artifacts/macos/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  release:
    name: Sign and create a draft release
    needs: [validate, macos-sign]
    if: >-
      always() && !cancelled() && github.repository == 'Zleap-AI/SAG-Wiki' &&
      startsWith(github.ref, 'refs/tags/v') && needs.validate.result == 'success' &&
      needs.macos-sign.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.13.0'
      - name: Require protected release environment and an unpublished tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs verify-environment
          node scripts/release.mjs validate
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'An existing release must be inspected and removed explicitly before retrying.' >&2
            exit 1
          fi
      - name: Install locked signing tools before granting access to the key
        run: npm ci --ignore-scripts
      - name: Revalidate source and download digest-verified platform artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ needs.validate.outputs.source_run }}
        run: node scripts/release-build-cache.mjs download
      - name: Require digest-verified notarized macOS artifacts from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs download-signed
      - name: Verify artifacts, sign updates and assemble the release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release.mjs assemble --input release-artifacts --output "releases/$RELEASE_VERSION/updates"
      - name: Attest the final public release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: releases/${{ needs.validate.outputs.version }}/updates/*
      - name: Create a draft release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$RELEASE_COMMIT" \
            --draft \
            --title "SAG Wiki $RELEASE_VERSION" \
            --notes-file "releases/$RELEASE_VERSION/updates/release-notes.md" \
            "releases/$RELEASE_VERSION/updates/"*
          {
            echo "Draft release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
            echo 'Review both platform installers, signatures and provenance before publishing.'
          } >> "$GITHUB_STEP_SUMMARY"
