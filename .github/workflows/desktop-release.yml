# Temporary audit branch only. No production/release jobs or signing credentials.
name: QPDF resource audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.13.0'
      - name: Compare baseline and relocated minimal QPDF on 1000-page PDF
        run: node scripts/qpdf-resource-audit.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qpdf-audit-${{ runner.os }}
          path: qa/qpdf-resource-audit/report.json
