name: Desktop build and release

on:
  workflow_dispatch:

# Main builds need no signing secrets or repository write token.
# Only protected tag release jobs gain signing credentials and write access.
permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  # Share compatible CLI/desktop dependencies; Cargo separates profiles and targets.
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
  RUST_BACKTRACE: '1'
  # Native tests create their own async runtimes and child processes. Bound
  # concurrent tests on the small hosted runners without reducing coverage.
  RUST_TEST_THREADS: '2'
  PYTHONUTF8: '1'

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
      native_tests: ${{ steps.tests.outputs.native_tests }}
      test_protocol: ${{ steps.tests.outputs.test_protocol }}
      test_client: ${{ steps.tests.outputs.test_client }}
      test_core: ${{ steps.tests.outputs.test_core }}
      test_cli: ${{ steps.tests.outputs.test_cli }}
      test_desktop: ${{ steps.tests.outputs.test_desktop }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Validate versions, commit and release tag
        id: source
        run: node scripts/release.mjs validate
      - name: Install locked build and test tools
        run: npm ci --ignore-scripts
      - name: Reuse native tests only for unchanged verified inputs
        id: tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-test-plan.mjs
      - name: Test release validation and signing
        run: node --test scripts/documentation-release.node-test.mjs scripts/release.node-test.mjs scripts/automatic-release.node-test.mjs scripts/release-downloads.node-test.mjs scripts/release-build-cache.node-test.mjs scripts/sign-macos-release.node-test.mjs scripts/release-assembly.node-test.mjs scripts/build-cli.node-test.mjs scripts/rust-dependency-cache.node-test.mjs scripts/parallel-cli.node-test.mjs scripts/release-test-plan.node-test.mjs
      - name: Build portable web assets once for all native binaries
        run: npm run build
      - name: Upload current-source portable web assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-web-${{ github.sha }}
          path: dist/
          overwrite: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 0



  documentation:
    name: Build bilingual documentation
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Reuse a verified documentation checkpoint or wait for its running producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs reuse documentation
      - run: npm --prefix docs-site ci
        if: steps.reuse.outputs.reuse != 'true'
      - name: Validate changelogs and record documentation provenance
        run: node scripts/documentation-release.mjs build
        if: steps.reuse.outputs.reuse != 'true'
      - run: npm --prefix docs-site run build
        if: steps.reuse.outputs.reuse != 'true'

      # Branch dispatches exercise every check without producing release receipts.
      - name: Record the verified checkpoint producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-documentation-${{ github.sha }}-${{ github.run_attempt }}
          path: release-checkpoints/documentation.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Test frontend
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Reuse a verified frontend checkpoint or wait for its running producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs reuse frontend
      - run: npm ci
      - name: Run platform-independent frontend tests once
        if: steps.reuse.outputs.reuse != 'true'
        run: npm test

      # Branch dispatches exercise every check without producing release receipts.
      - name: Record the verified checkpoint producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: release-checkpoints/frontend.json
          if-no-files-found: error
          retention-days: 14

  compile-cli:
    name: ${{ matrix.job_name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            job_name: Compile CLI macos
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-intel
            job_name: Compile CLI macos-intel
            runner: macos-15
            target: x86_64-apple-darwin
          - platform: windows
            job_name: Compile CLI windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 190
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      CACHE_KIND: build
      CACHE_ROLE: cli
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
      # Probe only earlier whole-build checkpoints. Never wait on the current
      # Build job: it will join this CLI output after compiling the desktop.
      - name: Skip compilation when the complete platform build is reusable
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs probe "build-${{ matrix.platform }}"
      - name: Verify Rosetta for the Intel CLI producer
        if: steps.reuse.outputs.reuse != 'true' && matrix.platform == 'macos-intel'
        run: |
          test "$(uname -m)" = arm64
          /usr/bin/arch -x86_64 /usr/bin/true
      - name: Set up Python
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
      - name: Set up Rust
        if: steps.reuse.outputs.reuse != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      - name: Restore Rust release cache
        if: steps.reuse.outputs.reuse != 'true'
        id: rust-release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &cli_release_cache_paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/release/.fingerprint/*
            src-tauri/target/release/build/*
            src-tauri/target/release/deps/*.rlib
            src-tauri/target/release/deps/*.rmeta
            src-tauri/target/release/deps/*.d
            src-tauri/target/release/deps/*.a
            src-tauri/target/release/deps/*.lib
            src-tauri/target/release/deps/*.so
            src-tauri/target/release/deps/*.dylib
            src-tauri/target/release/deps/*.dll
            !src-tauri/target/release/.fingerprint/sag-*
            !src-tauri/target/release/build/sag-*
            !src-tauri/target/release/deps/libsag_*
            !src-tauri/target/release/deps/sag_*
            src-tauri/target/${{ matrix.target }}/release/.fingerprint/*
            src-tauri/target/${{ matrix.target }}/release/build/*
            src-tauri/target/${{ matrix.target }}/release/deps/*.rlib
            src-tauri/target/${{ matrix.target }}/release/deps/*.rmeta
            src-tauri/target/${{ matrix.target }}/release/deps/*.d
            src-tauri/target/${{ matrix.target }}/release/deps/*.a
            src-tauri/target/${{ matrix.target }}/release/deps/*.lib
            src-tauri/target/${{ matrix.target }}/release/deps/*.so
            src-tauri/target/${{ matrix.target }}/release/deps/*.dylib
            src-tauri/target/${{ matrix.target }}/release/deps/*.dll
            !src-tauri/target/${{ matrix.target }}/release/.fingerprint/sag-*
            !src-tauri/target/${{ matrix.target }}/release/build/sag-*
            !src-tauri/target/${{ matrix.target }}/release/deps/libsag_*
            !src-tauri/target/${{ matrix.target }}/release/deps/sag_*
          key: &cli_release_cache_key rust-v4-${{ env.CACHE_ROLE }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
      - name: Restore compatible trusted tag dependencies
        if: steps.reuse.outputs.reuse != 'true' && steps.rust-release.outputs.cache-hit != 'true'
        id: tag-release
        timeout-minutes: 6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rust-dependency-cache.mjs restore
      - name: Restore older Rust cache if no compatible archive was found
        if: steps.reuse.outputs.reuse != 'true' && steps.rust-release.outputs.cache-hit != 'true' && steps.tag-release.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *cli_release_cache_paths
          key: *cli_release_cache_key
          restore-keys: |
            rust-v4-${{ env.CACHE_ROLE }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-
            rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-
      - name: Download the current-source portable web assets
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-web-${{ github.sha }}
          path: dist/
      - name: Compile the production CLI with its real embedded web assets
        if: steps.reuse.outputs.reuse != 'true'
        env:
          SAG_CARGO_TIMINGS: '1'
          SAG_WEB_DIST: ${{ github.workspace }}/dist
        run: node scripts/build-cli.mjs
      - name: Stage exact CLI and QPDF inputs with producer metadata
        if: steps.reuse.outputs.reuse != 'true'
        id: cli-stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$RELEASE_PLATFORM" == macos-intel ]]; then
            test "$(lipo -archs src-tauri/bin/sag)" = x86_64
            test "$(lipo -archs src-tauri/bin/qpdf/bin/qpdf)" = x86_64
          fi
          node scripts/parallel-cli.mjs stage
      - name: Upload the verified CLI input
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.cli-stage.outputs.artifact }}
          path: ${{ steps.cli-stage.outputs.directory }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload CLI compilation timings
        if: always() && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-timings-cli-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7
      - name: Save trusted main Rust release cache
        if: steps.reuse.outputs.reuse != 'true' && (github.repository == 'Zleap-AI/SAG-Wiki' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && steps.rust-release.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/release/.fingerprint/*
            src-tauri/target/release/build/*
            src-tauri/target/release/deps/*.rlib
            src-tauri/target/release/deps/*.rmeta
            src-tauri/target/release/deps/*.d
            src-tauri/target/release/deps/*.a
            src-tauri/target/release/deps/*.lib
            src-tauri/target/release/deps/*.so
            src-tauri/target/release/deps/*.dylib
            src-tauri/target/release/deps/*.dll
            !src-tauri/target/release/.fingerprint/sag-*
            !src-tauri/target/release/build/sag-*
            !src-tauri/target/release/deps/libsag_*
            !src-tauri/target/release/deps/sag_*
            src-tauri/target/${{ matrix.target }}/release/.fingerprint/*
            src-tauri/target/${{ matrix.target }}/release/build/*
            src-tauri/target/${{ matrix.target }}/release/deps/*.rlib
            src-tauri/target/${{ matrix.target }}/release/deps/*.rmeta
            src-tauri/target/${{ matrix.target }}/release/deps/*.d
            src-tauri/target/${{ matrix.target }}/release/deps/*.a
            src-tauri/target/${{ matrix.target }}/release/deps/*.lib
            src-tauri/target/${{ matrix.target }}/release/deps/*.so
            src-tauri/target/${{ matrix.target }}/release/deps/*.dylib
            src-tauri/target/${{ matrix.target }}/release/deps/*.dll
            !src-tauri/target/${{ matrix.target }}/release/.fingerprint/sag-*
            !src-tauri/target/${{ matrix.target }}/release/build/sag-*
            !src-tauri/target/${{ matrix.target }}/release/deps/libsag_*
            !src-tauri/target/${{ matrix.target }}/release/deps/sag_*
          key: ${{ steps.rust-release.outputs.cache-primary-key }}

      - name: Pack verified Rust dependency outputs
        if: steps.reuse.outputs.reuse != 'true' && steps.tag-release.outputs.hit != 'true'
        id: dependency-export
        timeout-minutes: 6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rust-dependency-cache.mjs pack
      - name: Upload Rust dependency outputs
        if: steps.dependency-export.outputs.directory != '' && steps.dependency-export.outcome == 'success'
        timeout-minutes: 6
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dependency-export.outputs.artifact }}
          path: ${{ steps.dependency-export.outputs.directory }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14


  native:
    name: ${{ matrix.job_name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            kind: test
            component: rust-macos
            job_name: Test Rust macos
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: macos-intel
            kind: test
            component: rust-macos-intel
            job_name: Test Rust macos-intel
            runner: macos-15-large
            target: x86_64-apple-darwin
          - platform: windows
            kind: test
            component: rust-windows
            job_name: Test Rust windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ needs.validate.outputs.native_tests == 'reuse' && 'ubuntu-24.04' || matrix.runner }}
    timeout-minutes: 190
    env: &native_environment
      TARGET_TRIPLE: ${{ matrix.target }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      CACHE_KIND: ${{ matrix.kind }}
      CACHE_ROLE: desktop
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps: &native_steps
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Reuse this checkpoint or wait for its running main or tag producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs reuse "${{ matrix.component }}"
      - name: Set up Python
        if: steps.reuse.outputs.reuse != 'true' && (matrix.kind == 'build' || needs.validate.outputs.native_tests != 'reuse')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
      - name: Set up Rust
        if: steps.reuse.outputs.reuse != 'true' && (matrix.kind == 'build' || needs.validate.outputs.native_tests != 'reuse')
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      # Cache dependency libraries/build metadata, not app or integration-test binaries.
      # Stable keys avoid a multi-GiB snapshot for every main commit.
      - name: Restore Rust debug cache
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse'
        id: rust-debug
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &native_debug_cache_paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/debug/.fingerprint/*
            src-tauri/target/debug/build/*
            src-tauri/target/debug/deps/*.rlib
            src-tauri/target/debug/deps/*.rmeta
            src-tauri/target/debug/deps/*.d
            src-tauri/target/debug/deps/*.a
            src-tauri/target/debug/deps/*.lib
            src-tauri/target/debug/deps/*.so
            src-tauri/target/debug/deps/*.dylib
            src-tauri/target/debug/deps/*.dll
            !src-tauri/target/debug/.fingerprint/sag-*
            !src-tauri/target/debug/build/sag-*
            !src-tauri/target/debug/deps/libsag_*
            !src-tauri/target/debug/deps/sag_*
          key: &native_debug_cache_key rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
      - name: Restore compatible trusted tag dependencies
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && steps.rust-debug.outputs.cache-hit != 'true'
        id: tag-debug
        timeout-minutes: 6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rust-dependency-cache.mjs restore
      - name: Restore older Rust cache if no compatible archive was found
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && steps.rust-debug.outputs.cache-hit != 'true' && steps.tag-debug.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *native_debug_cache_paths
          key: *native_debug_cache_key
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug1-
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug-
      - name: Install locked JavaScript dependencies
        if: steps.reuse.outputs.reuse != 'true' && (matrix.kind == 'build' || (needs.validate.outputs.native_tests != 'reuse' && needs.validate.outputs.test_desktop != 'false'))
        run: npm ci
      - name: Prepare and verify QPDF for native tests
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && (needs.validate.outputs.test_core != 'false' || needs.validate.outputs.test_cli != 'false' || needs.validate.outputs.test_desktop != 'false')
        run: |
          node scripts/prepare-qpdf.mjs
          node --test scripts/qpdf-packaging.node-test.mjs
      - name: 'Run native Rust suite: protocol'
        env:
          CARGO_PROFILE_TEST_DEBUG: '1'
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && needs.validate.outputs.test_protocol != 'false'
        run: |
          cargo test --locked --timings --manifest-path protocol/Cargo.toml
      - name: 'Run native Rust suite: client'
        env:
          CARGO_PROFILE_TEST_DEBUG: '1'
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && needs.validate.outputs.test_client != 'false'
        run: |
          cargo test --locked --timings --manifest-path client/Cargo.toml
      - name: 'Run native Rust suite: core'
        env:
          CARGO_PROFILE_TEST_DEBUG: '1'
          SAG_CORE_TEST_PROFILE: ${{ matrix.platform == 'macos-intel' && 'profile.test.package.sag-core.debug=0' || '' }}
          SAG_CORE_TEST_CODEGEN: ${{ matrix.platform == 'macos-intel' && 'profile.test.package.sag-core.codegen-units=32' || '' }}
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && needs.validate.outputs.test_core != 'false'
        run: |
          core_profile=()
          if [[ -n "$SAG_CORE_TEST_PROFILE" ]]; then
            core_profile=(--config "$SAG_CORE_TEST_PROFILE" --config "$SAG_CORE_TEST_CODEGEN")
          fi
          cargo test "${core_profile[@]}" --locked --timings --manifest-path core/Cargo.toml --lib --tests
      - name: 'Run native Rust suite: cli'
        env:
          CARGO_PROFILE_TEST_DEBUG: '1'
          SAG_CORE_TEST_PROFILE: ${{ matrix.platform == 'macos-intel' && 'profile.test.package.sag-core.debug=0' || '' }}
          SAG_CORE_TEST_CODEGEN: ${{ matrix.platform == 'macos-intel' && 'profile.test.package.sag-core.codegen-units=32' || '' }}
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && needs.validate.outputs.test_cli != 'false'
        run: |
          core_profile=()
          if [[ -n "$SAG_CORE_TEST_PROFILE" ]]; then
            core_profile=(--config "$SAG_CORE_TEST_PROFILE" --config "$SAG_CORE_TEST_CODEGEN")
          fi
          # Run the pipe leak probe first, then exclude its duplicate invocation.
          cargo test "${core_profile[@]}" --locked --timings --manifest-path cli/Cargo.toml --test service_spawn -- --nocapture
          cargo test "${core_profile[@]}" --locked --timings --manifest-path cli/Cargo.toml --bins --tests -- --nocapture --skip background_service_releases_both_foreground_capture_pipes_while_still_running
      - name: 'Run native Rust suite: desktop'
        env:
          CARGO_PROFILE_TEST_DEBUG: '1'
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && needs.validate.outputs.test_desktop != 'false'
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -File scripts/test-windows-desktop.ps1
          else
            cargo test --locked --timings --manifest-path src-tauri/Cargo.toml
          fi
      - name: Upload native compilation timings
        if: always() && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-timings-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7

      - name: Save trusted main Rust debug cache
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && needs.validate.outputs.native_tests != 'reuse' && (github.repository == 'Zleap-AI/SAG-Wiki' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && steps.rust-debug.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/debug/.fingerprint/*
            src-tauri/target/debug/build/*
            src-tauri/target/debug/deps/*.rlib
            src-tauri/target/debug/deps/*.rmeta
            src-tauri/target/debug/deps/*.d
            src-tauri/target/debug/deps/*.a
            src-tauri/target/debug/deps/*.lib
            src-tauri/target/debug/deps/*.so
            src-tauri/target/debug/deps/*.dylib
            src-tauri/target/debug/deps/*.dll
            !src-tauri/target/debug/.fingerprint/sag-*
            !src-tauri/target/debug/build/sag-*
            !src-tauri/target/debug/deps/libsag_*
            !src-tauri/target/debug/deps/sag_*
          key: ${{ steps.rust-debug.outputs.cache-primary-key }}
      # Test and production profiles run on independent runners. Ordinary bundles
      # have no signing credentials; the protected job finalizes these exact bytes.
      - name: Restore Rust release cache
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        id: rust-release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: &desktop_release_cache_paths |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/release/.fingerprint/*
            src-tauri/target/release/build/*
            src-tauri/target/release/deps/*.rlib
            src-tauri/target/release/deps/*.rmeta
            src-tauri/target/release/deps/*.d
            src-tauri/target/release/deps/*.a
            src-tauri/target/release/deps/*.lib
            src-tauri/target/release/deps/*.so
            src-tauri/target/release/deps/*.dylib
            src-tauri/target/release/deps/*.dll
            !src-tauri/target/release/.fingerprint/sag-*
            !src-tauri/target/release/build/sag-*
            !src-tauri/target/release/deps/libsag_*
            !src-tauri/target/release/deps/sag_*
            src-tauri/target/${{ matrix.target }}/release/.fingerprint/*
            src-tauri/target/${{ matrix.target }}/release/build/*
            src-tauri/target/${{ matrix.target }}/release/deps/*.rlib
            src-tauri/target/${{ matrix.target }}/release/deps/*.rmeta
            src-tauri/target/${{ matrix.target }}/release/deps/*.d
            src-tauri/target/${{ matrix.target }}/release/deps/*.a
            src-tauri/target/${{ matrix.target }}/release/deps/*.lib
            src-tauri/target/${{ matrix.target }}/release/deps/*.so
            src-tauri/target/${{ matrix.target }}/release/deps/*.dylib
            src-tauri/target/${{ matrix.target }}/release/deps/*.dll
            !src-tauri/target/${{ matrix.target }}/release/.fingerprint/sag-*
            !src-tauri/target/${{ matrix.target }}/release/build/sag-*
            !src-tauri/target/${{ matrix.target }}/release/deps/libsag_*
            !src-tauri/target/${{ matrix.target }}/release/deps/sag_*
          key: &desktop_release_cache_key rust-v4-${{ env.CACHE_ROLE }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
      - name: Restore compatible trusted tag dependencies
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && steps.rust-release.outputs.cache-hit != 'true'
        id: tag-release
        timeout-minutes: 6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rust-dependency-cache.mjs restore
      - name: Restore older Rust cache if no compatible archive was found
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && steps.rust-release.outputs.cache-hit != 'true' && steps.tag-release.outputs.hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: *desktop_release_cache_paths
          key: *desktop_release_cache_key
          restore-keys: |
            rust-v4-${{ env.CACHE_ROLE }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-
            rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-
      # CLI and desktop compilation run on separate runners. This job waits
      # only for its own platform CLI after desktop rustc has completed.
      - name: Download the current-source portable web assets
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-web-${{ github.sha }}
          path: dist/
      - name: Compile the production desktop without copying deferred CLI resources
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        env:
          SAG_RELEASE_WEB_READY: '1'
        run: node scripts/parallel-cli.mjs compile-desktop
      - name: Join the verified same-platform CLI input
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        env:
          GH_TOKEN: ${{ github.token }}
          SAG_WEB_DIST: ${{ github.workspace }}/dist
        run: node scripts/parallel-cli.mjs restore
      - name: Bundle the independently compiled production inputs
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        run: node scripts/parallel-cli.mjs bundle
      # Release-tooling regressions run once in validate; native runtime checks stay here.
      - name: Regress document workers and Windows resource loading
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        run: python -m unittest discover -s tests -p docling_pdf_session_test.py -v
      - name: Test Safari native saving
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (matrix.platform == 'macos')
        run: |
          swiftc browser-extension/safari/ClipFileStore.swift browser-extension/tests/ClipFileStoreTests.swift -o "$RUNNER_TEMP/clip-file-tests"
          "$RUNNER_TEMP/clip-file-tests"
          swiftc browser-extension/safari/ClipFileStore.swift browser-extension/tests/DefaultDirectoryTests.swift -o "$RUNNER_TEMP/clip-default-tests"
          "$RUNNER_TEMP/clip-default-tests"
          node --test scripts/clipper-build.node-test.mjs
      - name: Upload desktop compilation timings
        if: always() && matrix.kind == 'build' && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-timings-desktop-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7
      - name: Verify the actual macOS application bundle
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (matrix.platform != 'windows')
        run: |
          export SAG_DESKTOP_BUNDLE="$PWD/src-tauri/target/$TARGET_TRIPLE/release/bundle/macos/SAG Wiki.app"
          python -m unittest discover -s tests -p desktop_bundle_test.py
      - name: Stage artifacts and record their source and digests
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        run: node scripts/release.mjs stage --platform "$RELEASE_PLATFORM" --target "$TARGET_TRIPLE"
      - name: Install and exercise the Windows package
        id: windows-smoke
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (matrix.platform == 'windows')
        shell: pwsh
        run: |
          & ./scripts/smoke-windows.ps1 -Installer "release-artifacts/windows/SAG-Wiki-$env:RELEASE_VERSION-Windows-x64-setup.exe" -Version $env:RELEASE_VERSION
      - name: Exercise local Jev through the installed Windows package CLI
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (matrix.platform == 'windows')
        env:
          INSTALLED_CLI: ${{ steps.windows-smoke.outputs.cli }}
        run: python tests/local-jev-e2e.py --binary "$INSTALLED_CLI"
      - name: Upload only staged public artifacts
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save trusted main Rust release cache
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (github.repository == 'Zleap-AI/SAG-Wiki' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && steps.rust-release.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/release/.fingerprint/*
            src-tauri/target/release/build/*
            src-tauri/target/release/deps/*.rlib
            src-tauri/target/release/deps/*.rmeta
            src-tauri/target/release/deps/*.d
            src-tauri/target/release/deps/*.a
            src-tauri/target/release/deps/*.lib
            src-tauri/target/release/deps/*.so
            src-tauri/target/release/deps/*.dylib
            src-tauri/target/release/deps/*.dll
            !src-tauri/target/release/.fingerprint/sag-*
            !src-tauri/target/release/build/sag-*
            !src-tauri/target/release/deps/libsag_*
            !src-tauri/target/release/deps/sag_*
            src-tauri/target/${{ matrix.target }}/release/.fingerprint/*
            src-tauri/target/${{ matrix.target }}/release/build/*
            src-tauri/target/${{ matrix.target }}/release/deps/*.rlib
            src-tauri/target/${{ matrix.target }}/release/deps/*.rmeta
            src-tauri/target/${{ matrix.target }}/release/deps/*.d
            src-tauri/target/${{ matrix.target }}/release/deps/*.a
            src-tauri/target/${{ matrix.target }}/release/deps/*.lib
            src-tauri/target/${{ matrix.target }}/release/deps/*.so
            src-tauri/target/${{ matrix.target }}/release/deps/*.dylib
            src-tauri/target/${{ matrix.target }}/release/deps/*.dll
            !src-tauri/target/${{ matrix.target }}/release/.fingerprint/sag-*
            !src-tauri/target/${{ matrix.target }}/release/build/sag-*
            !src-tauri/target/${{ matrix.target }}/release/deps/libsag_*
            !src-tauri/target/${{ matrix.target }}/release/deps/sag_*
          key: ${{ steps.rust-release.outputs.cache-primary-key }}

      # Tag-scoped Actions caches cannot be restored by later tags. Transfer only
      # dependency outputs; consumers revalidate the producer, latest job and digest.
      # Branch dispatches upload a separate validation namespace, never trusted data.
      - name: Pack verified Rust dependency outputs
        if: steps.reuse.outputs.reuse != 'true' && (matrix.kind == 'build' || needs.validate.outputs.native_tests != 'reuse') && steps.tag-debug.outputs.hit != 'true' && steps.tag-release.outputs.hit != 'true'
        id: dependency-export
        timeout-minutes: 6
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/rust-dependency-cache.mjs pack
      - name: Upload Rust dependency outputs
        if: steps.dependency-export.outputs.directory != '' && steps.dependency-export.outcome == 'success'
        timeout-minutes: 6
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.dependency-export.outputs.artifact }}
          path: ${{ steps.dependency-export.outputs.directory }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      # Branch dispatches exercise every check without producing release receipts.
      - name: Record the verified checkpoint producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-${{ matrix.component }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-checkpoints/${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 14

  build-macos:
    name: ${{ matrix.job_name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            kind: build
            component: build-macos
            job_name: Build macos
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 190
    env: *native_environment
    steps: *native_steps

  build-macos-intel:
    name: ${{ matrix.job_name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-intel
            kind: build
            component: build-macos-intel
            job_name: Build macos-intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 190
    env: *native_environment
    steps: *native_steps

  build-windows:
    name: ${{ matrix.job_name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            kind: build
            component: build-windows
            job_name: Build windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 190
    env: *native_environment
    steps: *native_steps

  sign-macos:
    name: Sign ${{ matrix.platform }}
    needs: [validate, build-macos]
    if: >-
      !cancelled() && github.repository == 'Zleap-AI/SAG-Wiki' &&
      startsWith(github.ref, 'refs/tags/v') && needs.validate.result == 'success' &&
      needs.build-macos.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    environment:
      name: release
    permissions:
      contents: read
      actions: read
    env: &signing_environment
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps: &signing_steps
      - name: Check out the validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
      - name: Require automatic release restrictions and an unpublished tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs verify-environment
          node scripts/release.mjs validate
          node scripts/automatic-release.mjs check-draft
      - name: Wait only for the verified macOS build and download its input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs wait "${{ matrix.platform }}"
      # Native tests and other architectures keep running while this Mac signs
      # and notarizes. Final assembly retains the existing all-checkpoint check.
      # Secrets are scoped to the protected signing steps, never main jobs.
      # Intel hosted runners can lose Apple's HTTP/3 ticket connection.
      # Force TCP only in this disposable signing job (runner-images#14924).
      - name: Use TCP for Apple ticket delivery on Intel
        if: matrix.platform == 'macos-intel'
        run: |
          echo "block return out quick proto udp from any to any port 443" | sudo pfctl -f -
          sudo pfctl -E
      - name: Sign, notarize and test the final macOS installer and updater
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/sign-macos-release.mjs --input release-artifacts --output signed-release-artifacts --release-platform "${{ matrix.platform }}"
      - name: Upload verified signed macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-signed-${{ github.sha }}
          path: signed-release-artifacts/
          # A release-only retry reuses successful signing jobs from this run.
          overwrite: true
          if-no-files-found: error
          retention-days: 3
          compression-level: 0


  sign-macos-intel:
    name: Sign ${{ matrix.platform }}
    needs: [validate, build-macos-intel]
    if: >-
      !cancelled() && github.repository == 'Zleap-AI/SAG-Wiki' &&
      startsWith(github.ref, 'refs/tags/v') && needs.validate.result == 'success' &&
      needs.build-macos-intel.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    environment:
      name: release
    permissions:
      contents: read
      actions: read
    env: *signing_environment
    steps: *signing_steps

  release:
    name: Sign and create a draft release
    outputs:
      checksums: ${{ steps.draft.outputs.checksums }}
    needs: [validate, sign-macos, sign-macos-intel]
    if: >-
      !cancelled() && github.repository == 'Zleap-AI/SAG-Wiki' &&
      startsWith(github.ref, 'refs/tags/v') && needs.validate.result == 'success' &&
      needs.sign-macos.result == 'success' && needs.sign-macos-intel.result == 'success'
    # Assembly only signs updater bytes; Apple tools remain in the Mac jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment:
      name: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13.9'
      - name: Require automatic release restrictions and an unpublished tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs verify-environment
          node scripts/release.mjs validate
          node scripts/automatic-release.mjs check-draft
      - name: Require all final checkpoints and download verified build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs wait all
      - name: Download both signed Mac architectures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: desktop-*-signed-${{ github.sha }}
          path: signed-release-artifacts/
          merge-multiple: true
      - name: Install locked signing tools before granting access to the key
        run: npm ci --ignore-scripts
      - name: Verify artifacts, sign updates and assemble the release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release.mjs assemble --input release-artifacts --output "releases/$RELEASE_VERSION/updates"
      - name: Attest the final public release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: releases/${{ needs.validate.outputs.version }}/updates/*
      - name: Create or recover only this exact automation-owned draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-release.mjs create-draft


  publish:
    name: Publish verified desktop release
    needs: [validate, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Publishing is short and serialized across versions. Recheck public versions
    # inside this lock so an older slow build can never roll back latest.
    concurrency:
      group: desktop-release-publication
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_CHECKSUMS: ${{ needs.release.outputs.checksums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Publish the checked draft without rolling back latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-release.mjs publish
