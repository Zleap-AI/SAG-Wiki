name: Desktop build and release

on:
  workflow_dispatch:

# Main builds need no signing secrets or repository write token.
# Only protected tag release jobs gain signing credentials and write access.
permissions:
  contents: read
  actions: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  # Share compatible CLI/desktop dependencies; Cargo separates profiles and targets.
  CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
  RUST_BACKTRACE: '1'
  # Native tests create their own async runtimes and child processes. Bound
  # concurrent tests on the small hosted runners without reducing coverage.
  RUST_TEST_THREADS: '2'
  PYTHONUTF8: '1'

jobs:
  validate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.source.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Check out the event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Validate versions, commit and release tag
        id: source
        run: node scripts/release.mjs validate
      - name: Test release validation and signing
        run: node --test scripts/release.node-test.mjs scripts/automatic-release.node-test.mjs scripts/release-downloads.node-test.mjs scripts/release-build-cache.node-test.mjs scripts/sign-macos-release.node-test.mjs


  documentation:
    name: Build bilingual documentation
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Reuse a verified documentation checkpoint or wait for its running producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs reuse documentation
      - run: npm --prefix docs-site ci
        if: steps.reuse.outputs.reuse != 'true'
      - run: npm --prefix docs-site run build
        if: steps.reuse.outputs.reuse != 'true'

      # Branch dispatches exercise every check without producing release receipts.
      - name: Record the verified checkpoint producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-documentation-${{ github.sha }}-${{ github.run_attempt }}
          path: release-checkpoints/documentation.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Test frontend
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Reuse a verified frontend checkpoint or wait for its running producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs reuse frontend
      - run: npm ci
        if: steps.reuse.outputs.reuse != 'true'
      - name: Run platform-independent frontend tests once
        if: steps.reuse.outputs.reuse != 'true'
        run: npm test

      # Branch dispatches exercise every check without producing release receipts.
      - name: Record the verified checkpoint producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-frontend-${{ github.sha }}-${{ github.run_attempt }}
          path: release-checkpoints/frontend.json
          if-no-files-found: error
          retention-days: 14

  native:
    name: ${{ matrix.job_name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            kind: test
            component: rust-macos
            job_name: Test Rust macos
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            kind: test
            component: rust-windows
            job_name: Test Rust windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: macos
            kind: build
            component: build-macos
            job_name: Build macos
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            kind: build
            component: build-windows
            job_name: Build windows
            runner: windows-2025
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 190
    env:
      TARGET_TRIPLE: ${{ matrix.target }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Check out the validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
          cache: npm
      - name: Reuse this checkpoint or wait for its running main or tag producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs reuse "${{ matrix.component }}"
      - name: Set up Python
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.9'
      - name: Set up Rust
        if: steps.reuse.outputs.reuse != 'true'
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.98.1'
          targets: ${{ matrix.target }}
      # Cache dependency libraries/build metadata, not app or integration-test binaries.
      # Stable keys avoid a multi-GiB snapshot for every main commit.
      - name: Restore Rust debug cache
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test'
        id: rust-debug
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/debug/.fingerprint/*
            src-tauri/target/debug/build/*
            src-tauri/target/debug/deps/*.rlib
            src-tauri/target/debug/deps/*.rmeta
            src-tauri/target/debug/deps/*.d
            src-tauri/target/debug/deps/*.a
            src-tauri/target/debug/deps/*.lib
            src-tauri/target/debug/deps/*.so
            src-tauri/target/debug/deps/*.dylib
            src-tauri/target/debug/deps/*.dll
            !src-tauri/target/debug/.fingerprint/sag-*
            !src-tauri/target/debug/build/sag-*
            !src-tauri/target/debug/deps/libsag_*
            !src-tauri/target/debug/deps/sag_*
          key: rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug1-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
          restore-keys: |
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug1-
            rust-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-debug-
      - name: Install locked JavaScript dependencies
        if: steps.reuse.outputs.reuse != 'true'
        run: npm ci
      - name: Regress release assembly, signatures and artifact transfer on this platform
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test'
        run: node --test scripts/release.node-test.mjs scripts/automatic-release.node-test.mjs scripts/release-downloads.node-test.mjs scripts/release-build-cache.node-test.mjs scripts/sign-macos-release.node-test.mjs scripts/release-assembly.node-test.mjs scripts/build-cli.node-test.mjs
      - name: Test Safari native saving and build development installer
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && (matrix.platform == 'macos')
        run: |
          swiftc browser-extension/safari/ClipFileStore.swift browser-extension/tests/ClipFileStoreTests.swift -o "$RUNNER_TEMP/clip-file-tests"
          "$RUNNER_TEMP/clip-file-tests"
          swiftc browser-extension/safari/ClipFileStore.swift browser-extension/tests/DefaultDirectoryTests.swift -o "$RUNNER_TEMP/clip-default-tests"
          "$RUNNER_TEMP/clip-default-tests"
          npm --prefix browser-extension ci --ignore-scripts
          node --test scripts/clipper-build.node-test.mjs
          npm run build:clipper:safari
      - name: Upload Safari development installer for acceptance
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && (matrix.platform == 'macos')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safari-development-${{ github.sha }}-${{ github.run_attempt }}
          path: browser-extension/build/sag-web-clipper-safari-development.dmg
          if-no-files-found: error
          retention-days: 3
      - name: Run native tests with locked dependencies
        env:
          # Keep assertions and overflow checks; reduce only test debug metadata.
          # Scope this to tests so production builds retain their release profiles.
          CARGO_PROFILE_TEST_DEBUG: '1'
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test'
        run: |
          node scripts/prepare-qpdf.mjs
          node --test scripts/qpdf-packaging.node-test.mjs
          cargo test --locked --timings --manifest-path protocol/Cargo.toml
          cargo test --locked --timings --manifest-path client/Cargo.toml
          cargo test --locked --timings --manifest-path core/Cargo.toml
          # Fail within a bounded regression test if daemon pipes leak again,
          # before running CLI tests that collect complete subprocess output.
          cargo test --locked --timings --manifest-path cli/Cargo.toml --test service_spawn -- --nocapture
          cargo test --locked --timings --manifest-path cli/Cargo.toml -- --nocapture
          if [[ "$RUNNER_OS" == Windows ]]; then
            pwsh -NoProfile -File scripts/test-windows-desktop.ps1
          else
            cargo test --locked --timings --manifest-path src-tauri/Cargo.toml
          fi
      - name: Upload native compilation timings
        if: always() && matrix.kind == 'test' && steps.reuse.outputs.reuse != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-timings-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: src-tauri/target/cargo-timings/
          if-no-files-found: warn
          retention-days: 7

      - name: Save trusted main Rust debug cache
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'test' && (github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.rust-debug.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/debug/.fingerprint/*
            src-tauri/target/debug/build/*
            src-tauri/target/debug/deps/*.rlib
            src-tauri/target/debug/deps/*.rmeta
            src-tauri/target/debug/deps/*.d
            src-tauri/target/debug/deps/*.a
            src-tauri/target/debug/deps/*.lib
            src-tauri/target/debug/deps/*.so
            src-tauri/target/debug/deps/*.dylib
            src-tauri/target/debug/deps/*.dll
            !src-tauri/target/debug/.fingerprint/sag-*
            !src-tauri/target/debug/build/sag-*
            !src-tauri/target/debug/deps/libsag_*
            !src-tauri/target/debug/deps/sag_*
          key: ${{ steps.rust-debug.outputs.cache-primary-key }}
      # Test and production profiles run on independent runners. Ordinary bundles
      # have no signing credentials; the protected job finalizes these exact bytes.
      - name: Restore Rust release cache
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        id: rust-release
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/release/.fingerprint/*
            src-tauri/target/release/build/*
            src-tauri/target/release/deps/*.rlib
            src-tauri/target/release/deps/*.rmeta
            src-tauri/target/release/deps/*.d
            src-tauri/target/release/deps/*.a
            src-tauri/target/release/deps/*.lib
            src-tauri/target/release/deps/*.so
            src-tauri/target/release/deps/*.dylib
            src-tauri/target/release/deps/*.dll
            !src-tauri/target/release/.fingerprint/sag-*
            !src-tauri/target/release/build/sag-*
            !src-tauri/target/release/deps/libsag_*
            !src-tauri/target/release/deps/sag_*
            src-tauri/target/${{ matrix.target }}/release/.fingerprint/*
            src-tauri/target/${{ matrix.target }}/release/build/*
            src-tauri/target/${{ matrix.target }}/release/deps/*.rlib
            src-tauri/target/${{ matrix.target }}/release/deps/*.rmeta
            src-tauri/target/${{ matrix.target }}/release/deps/*.d
            src-tauri/target/${{ matrix.target }}/release/deps/*.a
            src-tauri/target/${{ matrix.target }}/release/deps/*.lib
            src-tauri/target/${{ matrix.target }}/release/deps/*.so
            src-tauri/target/${{ matrix.target }}/release/deps/*.dylib
            src-tauri/target/${{ matrix.target }}/release/deps/*.dll
            !src-tauri/target/${{ matrix.target }}/release/.fingerprint/sag-*
            !src-tauri/target/${{ matrix.target }}/release/build/sag-*
            !src-tauri/target/${{ matrix.target }}/release/deps/libsag_*
            !src-tauri/target/${{ matrix.target }}/release/deps/sag_*
          key: rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/.cargo/config.toml') }}
          restore-keys: |
            rust-v3-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-1.98.1-release-
      - name: Build unsigned desktop installers
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        run: |
          config_args=()
          if [[ "$RELEASE_PLATFORM" == windows ]]; then
            config_args=(--config src-tauri/tauri.windows.conf.json)
          fi
          npm run tauri -- build --ci --target "$TARGET_TRIPLE" "${config_args[@]}" -- --locked
      - name: Verify the actual macOS application bundle
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (matrix.platform == 'macos')
        run: |
          export SAG_DESKTOP_BUNDLE="$PWD/src-tauri/target/$TARGET_TRIPLE/release/bundle/macos/SAG Wiki.app"
          python -m unittest discover -s tests -p desktop_bundle_test.py
      - name: Exercise local Jev through the actual macOS bundle CLI
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (matrix.platform == 'macos')
        run: python tests/local-jev-e2e.py --binary "src-tauri/target/$TARGET_TRIPLE/release/bundle/macos/SAG Wiki.app/Contents/Resources/bin/sag"
      - name: Stage artifacts and record their source and digests
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        run: node scripts/release.mjs stage --platform "$RELEASE_PLATFORM" --target "$TARGET_TRIPLE"
      - name: Install and exercise the Windows package
        id: windows-smoke
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (matrix.platform == 'windows')
        shell: pwsh
        run: |
          & ./scripts/smoke-windows.ps1 -Installer "release-artifacts/windows/SAG-Wiki-$env:RELEASE_VERSION-Windows-x64-setup.exe" -Version $env:RELEASE_VERSION
      - name: Exercise local Jev through the installed Windows package CLI
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (matrix.platform == 'windows')
        env:
          INSTALLED_CLI: ${{ steps.windows-smoke.outputs.cli }}
        run: python tests/local-jev-e2e.py --binary "$INSTALLED_CLI"
      - name: Upload only staged public artifacts
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-artifacts/${{ matrix.platform }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save trusted main Rust release cache
        if: steps.reuse.outputs.reuse != 'true' && matrix.kind == 'build' && (github.ref == 'refs/heads/main' && github.event_name == 'push' && steps.rust-release.outputs.cache-hit != 'true')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target/release/.fingerprint/*
            src-tauri/target/release/build/*
            src-tauri/target/release/deps/*.rlib
            src-tauri/target/release/deps/*.rmeta
            src-tauri/target/release/deps/*.d
            src-tauri/target/release/deps/*.a
            src-tauri/target/release/deps/*.lib
            src-tauri/target/release/deps/*.so
            src-tauri/target/release/deps/*.dylib
            src-tauri/target/release/deps/*.dll
            !src-tauri/target/release/.fingerprint/sag-*
            !src-tauri/target/release/build/sag-*
            !src-tauri/target/release/deps/libsag_*
            !src-tauri/target/release/deps/sag_*
            src-tauri/target/${{ matrix.target }}/release/.fingerprint/*
            src-tauri/target/${{ matrix.target }}/release/build/*
            src-tauri/target/${{ matrix.target }}/release/deps/*.rlib
            src-tauri/target/${{ matrix.target }}/release/deps/*.rmeta
            src-tauri/target/${{ matrix.target }}/release/deps/*.d
            src-tauri/target/${{ matrix.target }}/release/deps/*.a
            src-tauri/target/${{ matrix.target }}/release/deps/*.lib
            src-tauri/target/${{ matrix.target }}/release/deps/*.so
            src-tauri/target/${{ matrix.target }}/release/deps/*.dylib
            src-tauri/target/${{ matrix.target }}/release/deps/*.dll
            !src-tauri/target/${{ matrix.target }}/release/.fingerprint/sag-*
            !src-tauri/target/${{ matrix.target }}/release/build/sag-*
            !src-tauri/target/${{ matrix.target }}/release/deps/libsag_*
            !src-tauri/target/${{ matrix.target }}/release/deps/sag_*
          key: ${{ steps.rust-release.outputs.cache-primary-key }}

      # Branch dispatches exercise every check without producing release receipts.
      - name: Record the verified checkpoint producer
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-${{ matrix.component }}-${{ github.sha }}-${{ github.run_attempt }}
          path: release-checkpoints/${{ matrix.component }}.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Sign and create a draft release
    outputs:
      checksums: ${{ steps.draft.outputs.checksums }}
    needs: validate
    if: >-
      !cancelled() && github.repository == 'Zleap-AI/SAG-Wiki' &&
      startsWith(github.ref, 'refs/tags/v') && needs.validate.result == 'success'
    runs-on: macos-15
    timeout-minutes: 360
    environment:
      name: release
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out the validated release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.9'
      - name: Require automatic release restrictions and an unpublished tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release.mjs verify-environment
          node scripts/release.mjs validate
          node scripts/automatic-release.mjs check-draft
      - name: Wait only for verified macOS build and tests and download its input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs wait macos
      # Windows compilation and tests continue while Apple signs and notarizes.
      # Secrets are scoped to the protected signing steps, never main jobs.
      - name: Sign, notarize and test the final macOS installer and updater
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/sign-macos-release.mjs --input release-artifacts --output signed-release-artifacts
      - name: Upload verified signed macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos-signed-${{ github.sha }}-${{ github.run_attempt }}
          path: signed-release-artifacts/macos/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Require all final checkpoints and download verified Windows input
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-build-cache.mjs wait all
      - name: Install locked signing tools before granting access to the key
        run: npm ci --ignore-scripts
      - name: Verify artifacts, sign updates and assemble the release
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/release.mjs assemble --input release-artifacts --output "releases/$RELEASE_VERSION/updates"
      - name: Attest the final public release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: releases/${{ needs.validate.outputs.version }}/updates/*
      - name: Create or recover only this exact automation-owned draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-release.mjs create-draft


  publish:
    name: Publish verified desktop release
    needs: [validate, release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # Publishing is short and serialized across versions. Recheck public versions
    # inside this lock so an older slow build can never roll back latest.
    concurrency:
      group: desktop-release-publication
      cancel-in-progress: false
      queue: max
    env:
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_CHECKSUMS: ${{ needs.release.outputs.checksums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.13.0'
      - name: Publish the checked draft without rolling back latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automatic-release.mjs publish
