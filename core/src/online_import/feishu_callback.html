<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} · SAG Wiki</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      --background: #fff;
      --text: #232326;
      --muted: #626267;
      --border: #e1e1e5;
      --status: #286747;
      --status-bg: #eaf4ed;
      --error: #9b4838;
      --error-bg: #faeee9;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 28px 20px;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
    }

    main {
      width: min(100%, 440px);
      padding: clamp(26px, 7vw, 36px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--background);
      box-shadow: 0 5px 20px #1010180d;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .brand img { display: block; border-radius: 8px; }

    .status {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      margin-top: 28px;
      border-radius: 50%;
      background: var(--status-bg);
      color: var(--status);
    }

    .status::before {
      content: "";
      width: 12px;
      height: 6px;
      border: solid currentColor;
      border-width: 0 0 2px 2px;
      transform: translateY(-1px) rotate(-45deg);
    }

    [data-close="false"] .status {
      color: var(--error);
      background: var(--error-bg);
    }

    [data-close="false"] .status::before {
      content: "!";
      width: auto;
      height: auto;
      border: 0;
      font-size: 21px;
      font-weight: 700;
      transform: none;
    }

    h1 {
      margin: 13px 0 6px;
      font-size: clamp(22px, 5vw, 27px);
      line-height: 1.28;
      font-weight: 650;
      letter-spacing: -0.03em;
    }

    p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.6; }

    .close-note {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main data-close="{{autoClose}}">
    <div class="brand">
      <img src="data:image/png;base64,{{logo}}" width="36" height="36" alt="">
      SAG Wiki
    </div>
    <div class="status" aria-hidden="true"></div>
    <h1>{{title}}</h1>
    <p>{{message}}</p>
    <p class="close-note">{{closeNote}}</p>
  </main>
  <script nonce="{{nonce}}">
    if (document.querySelector('main').dataset.close === 'true') {
      window.setTimeout(() => window.close(), 1200);
    }
    window.history.replaceState(null, '', window.location.pathname);
  </script>
</body>
</html>
