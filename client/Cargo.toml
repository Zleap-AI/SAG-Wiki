[package]
name = "sag-client"
version = "0.1.0"
edition = "2021"
[dependencies]
sag-protocol = { path = "../protocol" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
dirs = "6"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "query", "stream", "rustls", "multipart", "socks"] }
rusqlite = { version = "0.37", features = ["bundled"] }
ipnet = "2"
glob = "0.3"
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
walkdir = "2"
pulldown-cmark = "0.13"
scraper = "0.24"
infer = "0.19"
percent-encoding = "2"
unicode-normalization = "0.1"
[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
