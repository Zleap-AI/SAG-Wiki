[package]
name = "sag-desktop-fnos"
version = "0.1.13"
edition = "2021"

[[bin]]
name = "sag-desktop-fnos"
path = "src/main.rs"

[[bin]]
name = "sag-fnos-worker"
path = "src/worker.rs"

[dependencies]
sag-client = { path = "../client" }
shlex = "1"
sag-core = { path = "../core" }
sag-protocol = { path = "../protocol" }
anyhow = "1"
axum = "0.8"
async-stream = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-streamable-http-server"] }
sha2 = "0.10"
subtle = "2"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

