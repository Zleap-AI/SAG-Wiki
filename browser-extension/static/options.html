<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SAG Web Clipper</title><link rel="stylesheet" href="style.css"></head><body><main class="settings">
<header><img src="icon-128.png" width="40" height="40" alt=""><div><h1 data-i18n="title"></h1><p data-i18n="description"></p></div></header>
<section><label for="language" data-i18n="language"></label><select id="language"><option value="" data-i18n="automatic"></option><option value="zh-CN">简体中文</option><option value="en">English</option></select></section>
<section><label for="destination" data-i18n="destination"></label><select id="destination"><option value="default"></option><option value="folder"></option><option value="downloads" data-i18n="browserDownloads"></option></select><button id="choose-folder" class="secondary"></button><p id="folder-notice" data-i18n="folderIndexNotice" hidden></p></section>
<section id="download-options"><label for="directory" data-i18n="directory"></label><input id="directory" type="text" spellcheck="false"><p id="folder-help"></p><label id="save-as-field" class="checkbox"><input id="save-as" type="checkbox"><span data-i18n="saveAs"></span></label><p data-i18n="images"></p></section>
<button id="apply" data-i18n="apply"></button>
<p id="message" role="status" aria-live="polite"></p>
</main><script type="module" src="options.js"></script></body></html>
