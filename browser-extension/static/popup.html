<!doctype html><html lang="en" class="clipper-popup"><head><meta charset="utf-8"><title>SAG Web Clipper</title><link rel="stylesheet" href="style.css"></head><body class="popup dialog"><main>
<header><img src="icon-128.png" width="32" height="32" alt=""><h1 data-i18n="title"></h1><button id="cancel" class="secondary" data-i18n="cancel"></button></header>
<h2 id="page-title"></h2><p id="page-source" class="path"></p>
<section class="save-location"><label data-i18n="destination"></label><p id="directory"></p><p id="folder-setup" data-i18n="folderSetup" hidden></p><button id="settings" class="secondary" data-i18n="openSettings"></button></section>
<label id="preview-label" data-i18n="preview"></label><pre id="preview" tabindex="0" aria-labelledby="preview-label" aria-busy="true"></pre>
<p id="message" role="status" aria-live="polite"></p><button id="save" data-i18n="confirmSave" disabled></button>
</main><script type="module" src="popup.js"></script></body></html>
